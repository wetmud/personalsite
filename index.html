<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Jason Steltman</title>
  <style>

    :root{--bg:#fafaf8;--ink:#111;--muted:#666;--link:#0000EE;}

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAA////////////AAAA/wAAACIAAAAKAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABPAAAA/wAAAP8AAAAVAAAACgAAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAwAAAAMAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/////////////////////////////////8AAf/8AAD//AAAf/gAAH/4AAB/+AAAf/gAAH/4AAB/+AAAf/gAAH/8AAB//gAAf/8AAP//AAH//wAP//8A////AP///4H////D///////////////////////////////////////8=") 12 8,auto;}
    a{color:var(--link);text-decoration:underline;}
    a:visited{color:#551A8B;}
    a:hover{color:#EE0000;}
    header{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 2rem;border-bottom:1px solid #ccc;}
    .logo{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.15em;color:var(--muted);text-decoration:none;}
    .logo:hover{color:var(--ink);text-decoration:none;}
    nav{display:flex;gap:1.5rem;font-size:0.9rem;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;}
    nav a.contact-link{cursor:pointer;}
    body::before{content:'';position:fixed;inset:0;background:rgba(250,250,248,0.85);z-index:0;}
    body>*{position:relative;z-index:1;}
    .section-hero{min-height:100vh;display:flex;flex-direction:column;}
    .hero-content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2rem 2rem 3rem;}
    h1{
      font-family:Helvetica Neue,Helvetica,Arial,sans-serif;
      font-weight:900;
      line-height:0.88;
      letter-spacing:-0.04em;
      text-transform:uppercase;
      color:var(--ink);
      opacity:0;
      animation:slideUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards 0.2s;
    }
    h1 .first{display:block;font-size:clamp(3.5rem,10vw,10rem);}
    h1 .last{
      display:block;
      font-size:clamp(4rem, calc((100vw - 4rem) * 0.185), 20rem);
      white-space:nowrap;
    }
    .tagline{
      margin-top:1.2rem;
      font-family:Helvetica Neue,Helvetica,Arial,sans-serif;
      font-size:clamp(0.95rem,2vw,1.3rem);
      font-weight:700;
      letter-spacing:0.02em;
      color:var(--ink);
      opacity:0;
      animation:fadeIn 0.6s ease forwards 0.45s;
    }
    .subtitle{
      margin-top:0.5rem;
      font-family:Helvetica Neue,Helvetica,Arial,sans-serif;
      font-size:0.95rem;
      font-weight:400;
      letter-spacing:0.04em;
      color:var(--muted);
      opacity:0;
      animation:fadeIn 0.6s ease forwards 0.55s;
    }
    .scroll-cue{
      margin-top:2.5rem;
      font-family:Helvetica Neue,Helvetica,Arial,sans-serif;
      font-size:0.8rem;
      letter-spacing:0.1em;
      opacity:0;
      animation:fadeIn 0.6s ease forwards 0.8s;
    }
    .scroll-cue a{cursor:pointer;}

    /* Contact bubble modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(15,15,15,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.28s ease;padding:2rem;}
    .modal-overlay.open{opacity:1;pointer-events:all;}
    .modal{background:#fff;border-radius:20px;box-shadow:0 32px 80px rgba(0,0,0,0.28),0 8px 24px rgba(0,0,0,0.14);width:min(500px,92vw);transform:translateY(20px) scale(0.97);transition:transform 0.32s cubic-bezier(0.16,1,0.3,1);position:relative;}
    .modal-overlay.open .modal{transform:translateY(0) scale(1);}
    .modal-close{position:absolute;top:1rem;right:1.1rem;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#999;background:rgba(0,0,0,0.06);border:none;cursor:pointer;padding:0.35rem 0.7rem;border-radius:20px;transition:background 0.2s,color 0.2s;z-index:10;}
    .modal-close:hover{background:rgba(0,0,0,0.12);color:#EE0000;}
    .modal-body{padding:2.2rem 2.2rem 2.5rem;}
    .modal-body h2{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:900;text-transform:uppercase;letter-spacing:-0.03em;margin-bottom:2rem;}
    .form-field{margin-bottom:1.6rem;}
    .form-field label{display:block;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:0.62rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem;}
    .form-field input,.form-field textarea{width:100%;background:transparent;border:none;border-bottom:1px solid #aaa;padding:0.4rem 0;font-family:Times New Roman,Times,serif;font-size:1rem;color:var(--ink);outline:none;transition:border-color 0.2s;}
    .form-field input:focus,.form-field textarea:focus{border-bottom-color:var(--ink);}
    .form-field textarea{resize:none;height:90px;}
    .btn-send{background:var(--ink);color:var(--bg);border:none;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;padding:0.85rem 2rem;cursor:pointer;margin-top:0.5rem;transition:opacity 0.2s;}
    .btn-send:hover{opacity:0.7;}

    footer{border-top:1px solid #ccc;padding:1.5rem 2rem;display:flex;flex-direction:column;align-items:center;gap:0.8rem;}
    .footer-nav,.footer-socials{display:flex;gap:1.2rem;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:0.78rem;}
    .footer-copy{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:0.65rem;color:var(--muted);letter-spacing:0.08em;}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes slideUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>

<section class="section-hero" id="home">
  <header>
    <a class="logo" href="index.html">JS</a>
    <nav>
      <a href="art.html">Art</a>
      <a href="web.html">Web</a>
      <a href="blog.html">Blog</a>
      <a href="cv.html">CV</a>
      <a class="contact-link" onclick="openContact()">Connect</a>
    </nav>
  </header>

  <div class="hero-content">
    <h1>
      <span class="first">Jason</span>
      <span class="last">Steltman</span>
    </h1>
    <p class="tagline">Problems require Creative Solutions</p>
    <p class="subtitle">Artist &amp; Designer</p>
    <div class="scroll-cue">
      <a onclick="openContact()">Want to collaborate? &darr;</a>
    </div>
  </div>
</section>

<!-- Contact form bubble -->
<div class="modal-overlay" id="contact-modal" onclick="if(event.target===this)closeContact()">
  <div class="modal">
    <button class="modal-close" onclick="closeContact()">Close &times;</button>
    <div class="modal-body">
      <h2>Let&rsquo;s work<br>together</h2>
      <div class="form-field">
        <label>Your name</label>
        <input type="text" placeholder="First Last"/>
      </div>
      <div class="form-field">
        <label>Email</label>
        <input type="email" placeholder="you@example.com"/>
      </div>
      <div class="form-field">
        <label>Message</label>
        <textarea placeholder="Tell me about your project&hellip;"></textarea>
      </div>
      <button class="btn-send">Send Message</button>
    </div>
  </div>
</div>

<footer>
  <nav class="footer-nav">
    <a href="index.html">Home</a>
    <a href="art.html">Art</a>
    <a href="web.html">Web</a>
    <a href="blog.html">Blog</a>
    <a href="cv.html">CV</a>
    <a class="contact-link" onclick="openContact()">Connect</a>
  </nav>
  <div class="footer-socials">
    <a href="https://www.behance.net/jasonsteltman" target="_blank">Behance</a>
    <a href="https://www.instagram.com/jasonsteltman/" target="_blank">Instagram</a>
  </div>
  <p class="footer-copy">&copy; 2026 Jason Steltman. All rights reserved.</p>
</footer>

<script>
function openContact(){document.getElementById('contact-modal').classList.add('open');document.body.style.overflow='hidden';}
function closeContact(){document.getElementById('contact-modal').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeContact();});
if(window.location.hash==='#contact')openContact();
</script>

</body>
</html>
